name: Build & Release Android App (APK & AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK & AAB (Bundle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
            echo "Keystore decoded from repository secret."
          elif [ -f "release.keystore.base64" ]; then
            base64 -d release.keystore.base64 > release.jks
            echo "Keystore decoded from bundled release.keystore.base64."
          else
            echo "Using existing release.jks"
          fi

      - name: Prepare Environment File (.env)
        env:
          SEC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SEC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          SEC_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          SEC_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
          SEC_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || vars.R2_SECRET_ACCESS_KEY }}
          SEC_R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
          SEC_R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN || vars.R2_PUBLIC_DOMAIN }}
        run: |
          cp .env.example .env

          if [ -n "$SEC_SUPABASE_URL" ]; then
            sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SEC_SUPABASE_URL|" .env
          fi
          if [ -n "$SEC_SUPABASE_ANON_KEY" ]; then
            sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SEC_SUPABASE_ANON_KEY|" .env
          fi
          if [ -n "$SEC_R2_ACCOUNT_ID" ]; then
            sed -i "s|^R2_ACCOUNT_ID=.*|R2_ACCOUNT_ID=$SEC_R2_ACCOUNT_ID|" .env
          fi
          if [ -n "$SEC_R2_ACCESS_KEY_ID" ]; then
            sed -i "s|^R2_ACCESS_KEY_ID=.*|R2_ACCESS_KEY_ID=$SEC_R2_ACCESS_KEY_ID|" .env
          fi
          if [ -n "$SEC_R2_SECRET_ACCESS_KEY" ]; then
            sed -i "s|^R2_SECRET_ACCESS_KEY=.*|R2_SECRET_ACCESS_KEY=$SEC_R2_SECRET_ACCESS_KEY|" .env
          fi
          if [ -n "$SEC_R2_BUCKET_NAME" ]; then
            sed -i "s|^R2_BUCKET_NAME=.*|R2_BUCKET_NAME=$SEC_R2_BUCKET_NAME|" .env
          fi
          if [ -n "$SEC_R2_PUBLIC_DOMAIN" ]; then
            sed -i "s|^R2_PUBLIC_DOMAIN=.*|R2_PUBLIC_DOMAIN=$SEC_R2_PUBLIC_DOMAIN|" .env
          fi

          # Ensure no key is left empty to prevent Java 'String KEY = ;' syntax error
          sed -i 's/=\s*$/="default"/' .env
          echo "Environment file (.env) prepared safely."

      - name: Build Release Bundle (AAB for Play Store)
        run: gradle :app:bundleRelease -x lint
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'LovyChatRelease2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'LovyChatRelease2026' }}

      - name: Build Release APK
        run: gradle :app:assembleRelease -x lint
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'LovyChatRelease2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'LovyChatRelease2026' }}

      - name: Upload AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
